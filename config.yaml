data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  dataset_name: "mibici_refactorizado.csv"

model:
  random_state: 42
  pca_components: 0.95
  columnas_id: ["Viaje_Id", "Usuario_Id", "Origen_Id", "Destino_Id"]
  columnas_eliminar: ["id", "latitude", "longitude", "dpcapacity"]

tuning:
  n_estimators_list: [50, 100, 150]
  contamination_list: ["auto", 0.05, 0.1]